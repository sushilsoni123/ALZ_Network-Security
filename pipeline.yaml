trigger: none
pr: none

variables:
  TF_VERSION: "1.6.6"
  WORKING_DIR: "infra"

stages:
# -------------------------
# STAGE 1: PLAN
# -------------------------
- stage: Plan
  displayName: "Terraform Plan"
  jobs:
  - job: plan
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Terraform Plan (via AzureCLI login)"
      env: 
        TF_VAR_vmpassword: $(TF_VAR_vmpassword)
        TF_VAR_bgp_keyword: $(TF_VAR_bgp_keyword)
      inputs:
        azureSubscription: "sc-techutsav-001"     # <- service connection
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          echo "Install Terraform ${TF_VERSION}"
          curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
          terraform -version

          cd "$(WORKING_DIR)"

          echo "Terraform init"
          terraform init

          echo "Validate"
          terraform fmt -check -recursive
          terraform validate

          echo "Plan (binary + readable)"
          terraform plan -input=false -no-color -out=tfplan.binary
          terraform show -no-color tfplan.binary > tfplan.txt

          echo "Plan preview (first 200 lines)"
          sed -n '1,200p' tfplan.txt

    - bash: |
        set -euo pipefail
        cd "$(WORKING_DIR)"
        mkdir -p "$(Build.ArtifactStagingDirectory)/tfplan"
        cp -v tfplan.binary "$(Build.ArtifactStagingDirectory)/tfplan/"
        cp -v tfplan.txt "$(Build.ArtifactStagingDirectory)/tfplan/"
      displayName: "Stage plan artifacts"

    - publish: "$(Build.ArtifactStagingDirectory)/tfplan"
      artifact: tfplan
      displayName: "Publish tfplan artifact"

# -------------------------
# STAGE 2: APPLY (Manual Gate)
# -------------------------
- stage: Apply
  displayName: "Terraform Apply (Manual Approval Required)"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: apply
    displayName: "Apply"
    pool:
      vmImage: ubuntu-latest
    environment: tf-prod   # <-Approvals & checks on this environment
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: tfplan

          - task: AzureCLI@2
            displayName: "Terraform Apply (use reviewed plan)"
            env: 
              TF_VAR_vmpassword: $(TF_VAR_vmpassword)
              TF_VAR_bgp_keyword: $(TF_VAR_bgp_keyword)
            inputs:
              azureSubscription: "sc-techutsav-001"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "Install Terraform ${TF_VERSION}"
                curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
                sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
                terraform -version

                cd "$(WORKING_DIR)"

                echo "Terraform init"
                terraform init

                echo "Copy reviewed plan"
                cp -v "$(Pipeline.Workspace)/tfplan/tfplan.binary" ./tfplan.binary

                echo "Apply exact plan"
                terraform apply -input=false -auto-approve tfplan.binary

# -------------------------
# STAGE 3: DESTROY (Manual Gate + Variable switch)
# -------------------------
- stage: Destroy
  displayName: "Terraform Destroy (Manual Approval Required)"
  dependsOn: Plan
  condition: and(succeeded(), eq(variables['RUN_DESTROY'], 'true'))
  jobs:
  - deployment: destroy
    displayName: "Destroy"
    pool:
      vmImage: ubuntu-latest
    environment: tf-prod
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Terraform Destroy"
            inputs:
              azureSubscription: "sc-techutsav-001"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "Install Terraform ${TF_VERSION}"
                curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
                sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
                terraform -version

                cd "$(WORKING_DIR)"

                echo "Terraform init"
                terraform init

                echo "Destroy"
                terraform destroy -input=false -auto-approve
``